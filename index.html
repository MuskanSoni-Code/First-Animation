# First-Animation
⚡ Neon Dark# CSS Animation
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Dark Banner - Muskan Soni</title>
  <style>
    :root{
      --bg1:#0b0f17;
      --bg2:#071021;
      --neon1:#7cfffb;
      --neon2:#9b59ff;
      --accent:#ff6bcb;
      --glass: rgba(255,255,255,0.04);
    }
    html,body{height:100%;margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    .stage{
      height:300px; /* banner height */
      width:1200px; /* banner width - change as needed */
      max-width:100%;
      margin:18px auto;
      border-radius:14px;
      overflow:hidden;
      background: linear-gradient(120deg,var(--bg1), var(--bg2) 60%);
      position:relative;
      box-shadow: 0 10px 40px rgba(2,6,23,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
      padding:28px 40px;
      display:flex;
      align-items:center;
      gap:28px;
    }

    /* Floating particle dots */
    .particle{
      position:absolute; border-radius:50%; opacity:0.55; mix-blend-mode:screen;
      animation: float 6s linear infinite;
      filter: blur(6px);
    }
    .p1{width:120px;height:120px;left:-40px;top:10px;background:linear-gradient(45deg,var(--neon1), rgba(124,255,251,0.06)); animation-duration:12s}
    .p2{width:80px;height:80px;right:30px;top:30px;background:linear-gradient(45deg,var(--neon2), rgba(155,89,255,0.04)); animation-duration:10s}
    .p3{width:40px;height:40px;left:20%;bottom:10px;background:linear-gradient(45deg,var(--accent), rgba(255,107,203,0.05)); animation-duration:8s}
    @keyframes float{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-18px) translateX(8px)}100%{transform:translateY(0) translateX(0)}}

    /* Neon text block */
    .content{position:relative;z-index:5;display:flex;align-items:center;gap:22px;width:100%}
    .logo{
      width:140px;height:140px;border-radius:12px;background:linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.0));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    }
    .logo svg{width:82px;height:82px;filter:drop-shadow(0 6px 18px rgba(124,255,251,0.12));}

    .text{
      color:var(--neon1);
      text-shadow: 0 0 10px rgba(124,255,251,0.14), 0 0 30px rgba(155,89,255,0.08), 0 6px 40px rgba(2,6,23,0.8);
    }
    .title{
      font-size:32px;font-weight:700;letter-spacing:0.4px;margin:0;display:flex;align-items:center;gap:12px
    }
    .subtitle{margin:6px 0 0 0;color:#cfeff3;font-weight:500;opacity:0.9}

    /* Neon gradient text */
    .neon{
      background:linear-gradient(90deg,var(--neon1), var(--neon2), var(--accent));
      -webkit-background-clip:text;background-clip:text;color:transparent;
      position:relative;display:inline-block
    }
    .neon::after{
      content:'';position:absolute;inset:0;filter:blur(10px);opacity:0.55;background:linear-gradient(90deg,var(--neon1), var(--neon2), var(--accent));z-index:-1
    }

    /* small flicker */
    @keyframes flicker{
      0%,19%,21%,23%,25%,54%,56%,100%{opacity:1; text-shadow: 0 0 10px rgba(124,255,251,0.14), 0 0 28px rgba(155,89,255,0.08)}
      20%,24%,55%{opacity:0.6; text-shadow:none}
    }
    .title .neon{animation: flicker 4.6s infinite}

    /* callout badge */
    .badge{
      margin-left:auto;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px;color:#dfeaff;backdrop-filter: blur(6px);box-shadow:0 6px 20px rgba(0,0,0,0.6)
    }

    /* small caption */
    .meta{font-size:12px;color:#9ab9c3;margin-top:8px}

    /* responsive */
    @media (max-width:720px){
      .stage{padding:18px;flex-direction:column;height:auto}
      .logo{width:100px;height:100px}
      .title{font-size:22px}
    }
  </style>
</head>
<body>
  <div class="stage" role="img" aria-label="Neon dark GitHub banner - CSS Registration Animation by Muskan Soni">
    <div class="particle p1" aria-hidden></div>
    <div class="particle p2" aria-hidden></div>
    <div class="particle p3" aria-hidden></div>

    <div class="content">
      <div class="logo" aria-hidden>
        <!-- simple neon code icon -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 7L4 12L8 17" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 7L20 12L16 17" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 4L10 20" stroke="url(#g2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="g" x1="0" x2="1">
              <stop offset="0" stop-color="#7cfffb"/>
              <stop offset="1" stop-color="#9b59ff"/>
            </linearGradient>
            <linearGradient id="g2" x1="0" x2="1">
              <stop offset="0" stop-color="#ff6bcb"/>
              <stop offset="1" stop-color="#9b59ff"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <div class="text">
        <div>
          <h1 class="title"><span class="neon">CSS Registration Animation</span></h1>
          <div class="subtitle">Pure HTML &amp; CSS • Keyframes, transitions</div>
          <div class="meta">✨ Crafted with by Muskan Soni🚀• Day 1 for Coding💻 </div>
        </div>

        <div class="badge">Welcome Day 1</div>
      </div>
    </div>
  </div>

</body>
</html>
